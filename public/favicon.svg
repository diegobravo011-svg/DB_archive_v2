<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 100" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Dark background -->
  <rect width="44" height="100" fill="#0c1410"/>

  <!-- Outer crystal silhouette: prism with pointed termination top -->
  <path d="M22,4 L6,33 L5,94 L39,94 L38,33 Z"
    stroke="rgba(140,200,150,0.75)" stroke-width="1.2"
    fill="rgba(140,200,150,0.07)"/>

  <!-- Termination facets — left and right inner lines from tip -->
  <line x1="22" y1="4"  x2="14" y2="33" stroke="rgba(140,200,150,0.55)" stroke-width="0.9"/>
  <line x1="22" y1="4"  x2="30" y2="33" stroke="rgba(140,200,150,0.55)" stroke-width="0.9"/>

  <!-- Termination base — horizontal plane -->
  <line x1="6"  y1="33" x2="38" y2="33" stroke="rgba(140,200,150,0.45)" stroke-width="0.8"/>

  <!-- Inner prism vertical edges -->
  <line x1="14" y1="33" x2="13" y2="94" stroke="rgba(140,200,150,0.30)" stroke-width="0.7"/>
  <line x1="30" y1="33" x2="31" y2="94" stroke="rgba(140,200,150,0.30)" stroke-width="0.7"/>

  <!-- Sub-facet detail on termination shoulders -->
  <line x1="6"  y1="33" x2="14" y2="15" stroke="rgba(140,200,150,0.22)" stroke-width="0.6"/>
  <line x1="38" y1="33" x2="30" y2="15" stroke="rgba(140,200,150,0.22)" stroke-width="0.6"/>
</svg>
